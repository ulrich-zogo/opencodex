name: Log Guard Protect TDD

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
      - name: Protection contracts
        run: |
          bun test --isolate \
            tests/codex-log-guard-protection.test.ts \
            tests/codex-log-guard-processes.test.ts \
            tests/codex-log-guard-lock.test.ts \
            tests/codex-log-guard-policy.test.ts \
            tests/codex-log-guard-status-zero-write.test.ts \
            tests/api-codex-log-guard-protection.test.ts \
            tests/cli-codex-log-guard-protection.test.ts \
            tests/codex-log-guard-doctor-protection.test.ts
      - name: GUI protection contract
        run: cd gui && bun test --isolate tests/storage-log-guard-protection.test.tsx
      - name: Print React Doctor diagnostics
        shell: bash
        run: |
          set +e
          printf '%s\n' \
            'src/components/storage-workspace/StorageWorkspace.tsx' \
            'tests/storage-log-guard-protection.test.tsx' \
            > /tmp/log-guard-react-files.txt
          cd gui
          npm exec --yes --package react-doctor@0.9.11 -- react-doctor . \
            --json --json-compact --scope files \
            --changed-files-from /tmp/log-guard-react-files.txt \
            > /tmp/react-doctor.json
          status=$?
          cat /tmp/react-doctor.json
          exit "$status"
