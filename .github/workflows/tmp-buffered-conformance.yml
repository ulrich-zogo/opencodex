name: Temporary buffered conformance

on:
  push:
    branches:
      - fix/adapter-buffered-tool-conformance

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun test tests/adapter-buffered-tool-conformance.test.ts
