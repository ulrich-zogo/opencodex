name: Log Guard Reclaim TDD

on:
  pull_request: {}

permissions:
  contents: read

jobs:
  reclaim:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
      - name: Reclaim contracts
        run: |
          bun test --isolate \
            tests/codex-log-guard-maintenance.test.ts \
            tests/api-codex-log-guard-compact.test.ts \
            tests/cli-codex-log-guard-compact.test.ts
      - name: GUI reclaim contract
        run: cd gui && bun test --isolate tests/storage-log-guard-compact.test.tsx
